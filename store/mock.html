<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; height: 800px; font: 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         background: linear-gradient(135deg, #e7f6ec, #eef2ff); display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 36px 0 8px; color: #18181b; }
  p.sub { font-size: 18px; color: #52525b; margin: 0 0 28px; }
  .window { width: 1080px; background: #fff; border-radius: 14px; box-shadow: 0 30px 60px -20px rgba(24,24,27,.35); overflow: hidden; position: relative; }
  .bar { background: #f4f4f5; padding: 12px 14px 0; display: flex; gap: 6px; align-items: flex-end; }
  .lights { display: flex; gap: 7px; padding: 0 12px 12px 2px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #d4d4d8; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 9px 9px 0 0; color: #3f3f46; font-size: 13px; white-space: nowrap; }
  .tab.on { background: #fff; color: #18181b; font-weight: 500; }
  .tab b { width: 14px; height: 14px; border-radius: 4px; background: #d4d4d8; display: inline-block; }
  .url { padding: 10px 14px; border-bottom: 1px solid #e4e4e7; display: flex; justify-content: space-between; align-items: center; }
  .url span { background: #f4f4f5; border-radius: 8px; padding: 6px 12px; color: #52525b; font-size: 13px; width: 520px; }
  .url img { width: 18px; height: 18px; }
  .content { height: 540px; padding: 32px; }
  .content .line { height: 12px; background: #f4f4f5; border-radius: 6px; margin-bottom: 14px; }
  .popup { position: absolute; right: 18px; top: 92px; width: 340px; border-radius: 12px; box-shadow: 0 20px 40px -12px rgba(24,24,27,.35); border: 1px solid #e4e4e7; }
</style>
<h1>Tell your dev servers apart</h1>
<p class="sub">Localhost tabs are named after the project or git worktree serving them, plus the port.</p>
<div class="window">
  <div class="bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="tab"><b></b>shop-web · 3000</div>
    <div class="tab on"><b></b>demo-app-feature · 3001</div>
    <div class="tab"><b></b>shop-api · 8080</div>
    <div class="tab"><b></b>docs · 5173</div>
  </div>
  <div class="url"><span>localhost:3001/cart</span><img src="data:image/png;base64,{{ICON}}"></div>
  <div class="content">
    <div class="line" style="width:40%"></div><div class="line" style="width:65%"></div>
    <div class="line" style="width:55%"></div><div class="line" style="width:30%"></div>
  </div>
  <img class="popup" src="data:image/png;base64,{{POPUP}}">
</div>
